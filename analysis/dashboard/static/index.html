<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PiCC results</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
<script type="module" src="/static/app.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/"><img src="/static/icon.svg" alt="" width="22" height="22"><span>PiCC results</span></a>
  <nav class="mainnav">
    <a href="#/" data-nav="home">Batches</a>
    <a href="#/compare" data-nav="compare">Compare runs</a>
    <a href="#/docs" data-nav="docs">Reports</a>
    <a href="#/server" data-nav="server">Model server</a>
  </nav>
  <div class="topright">
    <input id="find" type="search" list="find-list" placeholder="Go to a run…" autocomplete="off" aria-label="Go to a run">
    <datalist id="find-list"></datalist>
    <button id="refresh" class="iconbtn" title="Reload the data">↻</button>
    <button id="theme" class="iconbtn" title="Switch light / dark">◐</button>
  </div>
</header>
<main id="app"><p class="loading">Loading…</p></main>
<div id="tip" class="tip" hidden></div>
</body>
</html>
